name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Every run between July and October 2026 hung and was cancelled at
    # the six-hour default ceiling: the smoke tests orphaned their
    # `next dev` process tree on Linux, so `npm run test` never returned
    # (see apps/web/test/devServerProcess_unit.ts). The orphaning itself
    # is fixed, but an unbounded job is what turned a small bug into six
    # wasted hours per run and a CI signal nobody could read. A real run
    # takes a few minutes; this fails fast and loudly instead.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Verify no real .env files are tracked
        run: |
          if git ls-files | grep -E '^\.env(\..+)?$' | grep -vx '\.env\.example'; then
            echo "A real .env file is tracked in git! Remove it before merging." >&2
            exit 1
          fi

      - name: Check fixture-data import boundary
        run: node scripts/check-fixture-boundaries.mjs

      - name: Build
        run: npm run build
